[project]
name = "aetherstore"
version = "0.1.0"
description = "A distributed search and streaming prediction engine, built from scratch"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
