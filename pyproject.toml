[project]
name = "aetherstore"
version = "0.1.0"
description = "A distributed search and streaming prediction engine, built from scratch"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# Needed only to talk to S3-compatible storage. The engine itself has no
# runtime dependencies, and every test that does not touch S3 runs without it.
s3 = ["boto3>=1.34"]
stream = [
    "confluent-kafka>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a running MinIO (make up)"]
