# MinIO: an S3-compatible object store, running locally.
#
# The first container in the project, and it arrives at step 7 rather than
# step 0 on purpose. The segment format, its codec, the byte-range reader, and
# BM25 all needed no infrastructure at all, and building them first meant no
# time was lost to container configuration before there was anything to run in
# one.
#
#   make up      start everything
#   make down    stop it
#   MinIO console     http://localhost:9001   (aether / aethersecret)
#   Redpanda console  http://localhost:8080

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aether
      MINIO_ROOT_PASSWORD: aethersecret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is healthy, then exits. Without this the
  # first run fails on a missing bucket rather than on anything interesting.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 aether aethersecret
        mc mb --ignore-existing local/aether
        mc ls local/aether > /dev/null
        echo "bucket ready: aether"

  # Redpanda: the Kafka wire protocol in one binary, no ZooKeeper, and around
  # 500MB of RAM. Nothing in this project is Redpanda specific, so the same
  # code runs against any Kafka cluster.
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      # Two listeners because the broker tells clients where to reach it, and
      # the right answer differs inside the compose network from outside it.
      # Getting this wrong is the single most common way a first Kafka setup
      # fails, and it fails confusingly: connection succeeds, then every
      # produce times out.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # Kafka API, from the host
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the topic with several partitions once the broker is healthy.
  # Partition count is the ceiling on indexer parallelism and cannot be raised
  # later without rehashing every key and breaking session locality, so it is
  # set generously from the start.
  createtopic:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    # A literal block, not a folded one. Folding turns a more-indented
    # continuation into a newline, which the shell reads as a second command;
    # that silently dropped --brokers and sent rpk to 127.0.0.1 inside a
    # container with no broker. The create is allowed to fail because the
    # topic may already exist, but the describe that follows must succeed, so
    # a genuine failure cannot be reported as success.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rpk topic create clickstream --partitions 12 --replicas 1 --brokers redpanda:9092 || true
        rpk topic describe clickstream --brokers redpanda:9092 > /dev/null
        echo "topic ready: clickstream (12 partitions)"

  # Web UI for the topic: messages, consumer groups, and lag.
  console:
    image: redpandadata/console:latest
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

volumes:
  minio-data:
  redpanda-data:
